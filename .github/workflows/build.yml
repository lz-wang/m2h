name: Test, Build and Notify

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  readiness:
    name: Check scaffold readiness
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.project.outputs.ready }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Detect implementation manifests
        id: project
        shell: bash
        run: |
          if [[ -f go.mod && -f web/package-lock.json ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Project implementation is not initialized; test and build jobs will be skipped."
          fi

      - name: Resolve version
        id: version
        run: echo "version=$(make version)" >> "$GITHUB_OUTPUT"

  test:
    name: Test and coverage
    needs: readiness
    if: needs.readiness.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          check-latest: true

      - name: Run checks and tests
        run: make ci

      - name: Generate coverage
        run: make coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          flags: backend
          name: backend
          fail_ci_if_error: false

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [readiness, test]
    if: needs.readiness.outputs.ready == 'true' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ""
            archive: tar.gz
          - goos: linux
            goarch: arm64
            suffix: ""
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            suffix: ""
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            suffix: ""
            archive: tar.gz
          - goos: windows
            goarch: amd64
            suffix: ".exe"
            archive: zip
          - goos: windows
            goarch: arm64
            suffix: ".exe"
            archive: zip
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          check-latest: true

      - name: Install and build WebUI
        run: make web-ci-install web-build

      - name: Build binary
        run: make build-os OS=${{ matrix.goos }} ARCH=${{ matrix.goarch }} VERSION=${{ needs.readiness.outputs.version }}

      - name: Package WebDAV archive
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.readiness.outputs.version }}"
          name="m2h_${version}_${{ matrix.goos }}_${{ matrix.goarch }}"
          package_dir="release/${name}"
          mkdir -p "${package_dir}"
          cp "dist/m2h_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.suffix }}" "${package_dir}/m2h${{ matrix.suffix }}"
          cp README.md LICENSE "${package_dir}/"
          if [[ "${{ matrix.archive }}" == 'zip' ]]; then
            archive="release/${name}.zip"
            (cd "${package_dir}" && zip -qr "${GITHUB_WORKSPACE}/${archive}" .)
          else
            archive="release/${name}.tar.gz"
            tar -C "${package_dir}" -czf "${archive}" .
          fi
          sha256sum "${archive}" > "${archive}.sha256"

      - name: Upload archive and checksum to WebDAV
        continue-on-error: true
        uses: bxb100/action-upload-webdav@v1
        with:
          webdav_address: ${{ secrets.WEBDAV_SERVER }}
          webdav_username: ${{ secrets.WEBDAV_USERNAME }}
          webdav_password: ${{ secrets.WEBDAV_PASSWORD }}
          webdav_upload_path: "/Shares/github/${{ github.repository }}/${{ needs.readiness.outputs.version }}"
          files: |
            release/m2h_${{ needs.readiness.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}.${{ matrix.archive }}
            release/m2h_${{ needs.readiness.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}.${{ matrix.archive }}.sha256

      - name: Upload binary
        uses: actions/upload-artifact@v6
        with:
          name: m2h_${{ needs.readiness.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/m2h_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.suffix }}
          if-no-files-found: error

  smoke:
    name: Smoke ${{ matrix.os }}
    needs: [readiness, test]
    if: needs.readiness.outputs.ready == 'true' && needs.test.result == 'success'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          check-latest: true

      - name: Build native binary
        shell: bash
        run: |
          npm ci --prefix web
          npm run build --prefix web
          binary="m2h"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then binary="m2h.exe"; fi
          go build -tags webui -trimpath -buildvcs=false \
            -ldflags "-X main.M2HVersion=${{ needs.readiness.outputs.version }}" \
            -o "${binary}" .

      - name: Run native command smoke tests
        timeout-minutes: 2
        shell: bash
        run: |
          binary="./m2h"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then binary="./m2h.exe"; fi
          bash scripts/smoke.sh "${binary}" '${{ needs.readiness.outputs.version }}'

  e2e:
    name: Browser regression
    needs: [readiness, test]
    if: needs.readiness.outputs.ready == 'true' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          check-latest: true

      - name: Install Web dependencies
        run: npm ci --prefix web

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright regression tests
        working-directory: web
        run: npm run test:e2e

      - name: Upload regression artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-traces
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore

  notify:
    name: Pushover notification
    needs: [readiness, test, build, smoke, e2e]
    if: always() && needs.readiness.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Notify via Pushover
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          CODECOV_REPORT_URL: ${{ format('https://app.codecov.io/gh/{0}/commit/{1}', github.repository, github.sha) }}
        run: |
          if [[ -z "${PUSHOVER_TOKEN}" || -z "${PUSHOVER_USER}" ]]; then
            echo "Pushover secrets are not configured; skipping notification."
            exit 0
          fi

          TEST_RESULT="${{ needs.test.result }}"
          BUILD_RESULT="${{ needs.build.result }}"
          SMOKE_RESULT="${{ needs.smoke.result }}"
          E2E_RESULT="${{ needs.e2e.result }}"
          if [[ "${TEST_RESULT}" == "success" && "${BUILD_RESULT}" == "success" && "${SMOKE_RESULT}" == "success" && "${E2E_RESULT}" == "success" ]]; then
            PRIORITY="0"
            TITLE="m2h 构建成功"
          else
            PRIORITY="1"
            TITLE="m2h 构建失败"
          fi

          MESSAGE=$(cat <<EOF
          <b>m2h 构建通知</b>
          <u>测试结果</u>: ${TEST_RESULT}
          <u>构建结果</u>: ${BUILD_RESULT}
          <u>三平台 Smoke</u>: ${SMOKE_RESULT}
          <u>浏览器回归</u>: ${E2E_RESULT}
          <u>版本</u>: <font color="#0000ff">${{ needs.readiness.outputs.version }}</font>
          <u>分支</u>: <i>${{ github.ref_name }}</i>
          <u>触发人</u>: <i>${{ github.actor }}</i>
          <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">查看运行详情</a>
          <a href="${CODECOV_REPORT_URL}">查看 Codecov 测试覆盖率报告</a>
          <u>提交内容</u>:
          ${HEAD_COMMIT_MESSAGE:-workflow_dispatch}
          EOF
          )

          curl -fsS https://api.pushover.net/1/messages.json \
            --data-urlencode "token=${PUSHOVER_TOKEN}" \
            --data-urlencode "user=${PUSHOVER_USER}" \
            --data-urlencode "title=${TITLE}" \
            --data-urlencode "priority=${PRIORITY}" \
            --data-urlencode "html=1" \
            --data-urlencode "message=${MESSAGE}"
