name: Test, Build and Notify

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  readiness:
    name: Check scaffold readiness
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.project.outputs.ready }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Detect implementation manifests
        id: project
        shell: bash
        run: |
          if [[ -f go.mod && -f web/package-lock.json ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Project implementation is not initialized; test and build jobs will be skipped."
          fi

      - name: Resolve version
        id: version
        run: echo "version=$(make version)" >> "$GITHUB_OUTPUT"

  test:
    name: Test and coverage
    needs: readiness
    if: needs.readiness.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          check-latest: true

      - name: Run checks and tests
        run: make ci

      - name: Generate coverage
        run: make coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          flags: backend
          name: backend
          fail_ci_if_error: false

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [readiness, test]
    if: needs.readiness.outputs.ready == 'true' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ""
          - goos: linux
            goarch: arm64
            suffix: ""
          - goos: darwin
            goarch: amd64
            suffix: ""
          - goos: darwin
            goarch: arm64
            suffix: ""
          - goos: windows
            goarch: amd64
            suffix: ".exe"
          - goos: windows
            goarch: arm64
            suffix: ".exe"
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          check-latest: true

      - name: Install and build WebUI
        run: make web-ci-install web-build

      - name: Build binary
        run: make build-os OS=${{ matrix.goos }} ARCH=${{ matrix.goarch }} VERSION=${{ needs.readiness.outputs.version }}

      - name: Upload binary
        uses: actions/upload-artifact@v6
        with:
          name: m2h_${{ needs.readiness.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/m2h_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.suffix }}
          if-no-files-found: error

  notify:
    name: Pushover notification
    needs: [readiness, test, build]
    if: always() && needs.readiness.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Notify via Pushover
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          CODECOV_REPORT_URL: ${{ format('https://app.codecov.io/gh/{0}/commit/{1}', github.repository, github.sha) }}
        run: |
          if [[ -z "${PUSHOVER_TOKEN}" || -z "${PUSHOVER_USER}" ]]; then
            echo "Pushover secrets are not configured; skipping notification."
            exit 0
          fi

          TEST_RESULT="${{ needs.test.result }}"
          BUILD_RESULT="${{ needs.build.result }}"
          if [[ "${TEST_RESULT}" == "success" && "${BUILD_RESULT}" == "success" ]]; then
            PRIORITY="0"
            TITLE="m2h 构建成功"
          else
            PRIORITY="1"
            TITLE="m2h 构建失败"
          fi

          MESSAGE=$(cat <<EOF
          <b>m2h 构建通知</b>
          <u>测试结果</u>: ${TEST_RESULT}
          <u>构建结果</u>: ${BUILD_RESULT}
          <u>版本</u>: <font color="#0000ff">${{ needs.readiness.outputs.version }}</font>
          <u>分支</u>: <i>${{ github.ref_name }}</i>
          <u>触发人</u>: <i>${{ github.actor }}</i>
          <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">查看运行详情</a>
          <a href="${CODECOV_REPORT_URL}">查看 Codecov 测试覆盖率报告</a>
          <u>提交内容</u>:
          ${HEAD_COMMIT_MESSAGE:-workflow_dispatch}
          EOF
          )

          curl -fsS https://api.pushover.net/1/messages.json \
            --data-urlencode "token=${PUSHOVER_TOKEN}" \
            --data-urlencode "user=${PUSHOVER_USER}" \
            --data-urlencode "title=${TITLE}" \
            --data-urlencode "priority=${PRIORITY}" \
            --data-urlencode "html=1" \
            --data-urlencode "message=${MESSAGE}"
