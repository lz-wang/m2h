name: Release and Notify

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v1.2.3"
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Validate tag and project
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${{ github.ref_name }}"
          fi

          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: release tag must match vX.Y.Z: ${tag}"
            exit 2
          fi
          if [[ ! -f go.mod || ! -f web/package-lock.json ]]; then
            echo "Error: project implementation manifests are missing"
            exit 2
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Validate Homebrew publishing credential
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          if [[ -z "${HOMEBREW_TAP_TOKEN}" ]]; then
            echo "Error: HOMEBREW_TAP_TOKEN is required to publish Formula/m2h.rb."
            exit 2
          fi

  test:
    name: Release checks
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          check-latest: true

      - name: Run release checks
        run: make ci

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [prepare, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ""
            archive: tar.gz
          - goos: linux
            goarch: arm64
            suffix: ""
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            suffix: ""
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            suffix: ""
            archive: tar.gz
          - goos: windows
            goarch: amd64
            suffix: ".exe"
            archive: zip
          - goos: windows
            goarch: arm64
            suffix: ".exe"
            archive: zip
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          check-latest: true

      - name: Install and build WebUI
        run: make web-ci-install web-build

      - name: Build binary
        run: make build-os OS=${{ matrix.goos }} ARCH=${{ matrix.goarch }} VERSION=${{ needs.prepare.outputs.version }}

      - name: Package release archive
        shell: bash
        run: |
          version="${{ needs.prepare.outputs.version }}"
          name="m2h_${version}_${{ matrix.goos }}_${{ matrix.goarch }}"
          source="dist/m2h_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.suffix }}"
          package_dir="release/${name}"

          mkdir -p "${package_dir}"
          cp "${source}" "${package_dir}/m2h${{ matrix.suffix }}"
          cp README.md LICENSE "${package_dir}/"

          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            archive="${GITHUB_WORKSPACE}/release/${name}.zip"
            (cd "${package_dir}" && zip -qr "${archive}" .)
          else
            archive="${GITHUB_WORKSPACE}/release/${name}.tar.gz"
            tar -C "${package_dir}" -czf "${archive}" .
          fi

          rm -rf "${package_dir}"
          archive_name="$(basename "${archive}")"
          (cd "${GITHUB_WORKSPACE}/release" && sha256sum "${archive_name}" > "${archive_name}.sha256")

      - name: Upload archive and checksum to WebDAV
        continue-on-error: true
        uses: bxb100/action-upload-webdav@v1
        with:
          webdav_address: ${{ secrets.WEBDAV_SERVER }}
          webdav_username: ${{ secrets.WEBDAV_USERNAME }}
          webdav_password: ${{ secrets.WEBDAV_PASSWORD }}
          webdav_upload_path: "/Shares/github/${{ github.repository }}/${{ needs.prepare.outputs.version }}"
          files: |
            release/m2h_${{ needs.prepare.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}.${{ matrix.archive }}
            release/m2h_${{ needs.prepare.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}.${{ matrix.archive }}.sha256

      - name: Upload release artifact
        uses: actions/upload-artifact@v6
        with:
          name: m2h-release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            release/*.tar.gz
            release/*.tar.gz.sha256
            release/*.zip
            release/*.zip.sha256
          if-no-files-found: error

  smoke:
    name: Smoke ${{ matrix.os }}
    needs: [prepare, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          check-latest: true

      - name: Build native binary
        shell: bash
        run: |
          npm ci --prefix web
          npm run build --prefix web
          binary="m2h"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then binary="m2h.exe"; fi
          go build -tags webui -trimpath -buildvcs=false \
            -ldflags "-X main.M2HVersion=${{ needs.prepare.outputs.version }}" \
            -o "${binary}" .

      - name: Run native command smoke tests
        timeout-minutes: 2
        shell: bash
        run: |
          binary="./m2h"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then binary="./m2h.exe"; fi
          bash scripts/smoke.sh "${binary}" '${{ needs.prepare.outputs.version }}'

  publish:
    name: Publish GitHub Release
    needs: [prepare, test, build, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Download release artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: m2h-release-*
          path: release-assets
          merge-multiple: true

      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          version="${{ needs.prepare.outputs.version }}"
          awk -v version="${version}" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
            END { if (!found) exit 2 }
          ' CHANGELOG.md > release-notes.md

          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "Error: CHANGELOG.md has no release notes for ${version}"
            exit 2
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release-assets/* --clobber
            gh release edit "${TAG}" --title "${TAG}" --notes-file release-notes.md
          else
            gh release create "${TAG}" release-assets/* \
              --verify-tag \
              --title "${TAG}" \
              --notes-file release-notes.md
          fi

  homebrew:
    name: Publish Homebrew Formula
    needs: [prepare, publish]
    runs-on: macos-latest
    concurrency:
      group: homebrew-tap
      cancel-in-progress: false
    steps:
      - name: Check latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          latest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          if [[ "${latest}" != "${TAG}" ]]; then
            echo "Skip stale release: ${TAG}; latest is ${latest}."
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "publish=true" >> "${GITHUB_OUTPUT}"

      - name: Checkout Homebrew tap
        if: steps.release.outputs.publish == 'true'
        uses: actions/checkout@v6
        with:
          repository: lz-wang/homebrew-tap
          ref: main
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Read release checksums
        if: steps.release.outputs.publish == 'true'
        id: sha
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          base="https://github.com/lz-wang/m2h/releases/download/${TAG}"
          for target in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64; do
            file="m2h_${VERSION}_${target}.tar.gz.sha256"
            sha="$(curl -fsSL "${base}/${file}" | awk 'NR == 1 { print $1 }')"

            if [[ ! "${sha}" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Error: invalid SHA-256 for ${file}."
              exit 2
            fi

            echo "${target}=${sha}" >> "${GITHUB_OUTPUT}"
          done

      - name: Generate Formula
        if: steps.release.outputs.publish == 'true'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          DARWIN_AMD64_SHA: ${{ steps.sha.outputs.darwin_amd64 }}
          DARWIN_ARM64_SHA: ${{ steps.sha.outputs.darwin_arm64 }}
          LINUX_AMD64_SHA: ${{ steps.sha.outputs.linux_amd64 }}
          LINUX_ARM64_SHA: ${{ steps.sha.outputs.linux_arm64 }}
        shell: bash
        run: |
          set -euo pipefail

          cat > homebrew-tap/Formula/m2h.rb <<RUBY
          class M2h < Formula
            desc "Convert and preview Markdown"
            homepage "https://github.com/lz-wang/m2h"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/lz-wang/m2h/releases/download/v${VERSION}/m2h_${VERSION}_darwin_arm64.tar.gz"
                sha256 "${DARWIN_ARM64_SHA}"
              end

              on_intel do
                url "https://github.com/lz-wang/m2h/releases/download/v${VERSION}/m2h_${VERSION}_darwin_amd64.tar.gz"
                sha256 "${DARWIN_AMD64_SHA}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/lz-wang/m2h/releases/download/v${VERSION}/m2h_${VERSION}_linux_arm64.tar.gz"
                sha256 "${LINUX_ARM64_SHA}"
              end

              on_intel do
                url "https://github.com/lz-wang/m2h/releases/download/v${VERSION}/m2h_${VERSION}_linux_amd64.tar.gz"
                sha256 "${LINUX_AMD64_SHA}"
              end
            end

            def install
              bin.install "m2h"
            end

            test do
              (testpath/"example.md").write "# m2h\\n"
              system bin/"m2h", "export", "example.md"
              assert_path_exists testpath/"example.html"
              assert_match "<h1", (testpath/"example.html").read
            end
          end
          RUBY

      - name: Commit Formula locally
        if: steps.release.outputs.publish == 'true'
        id: formula
        shell: bash
        run: |
          set -euo pipefail

          git -C homebrew-tap config user.name "github-actions[bot]"
          git -C homebrew-tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -z "$(git -C homebrew-tap status --porcelain -- Formula/m2h.rb)" ]]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git -C homebrew-tap add Formula/m2h.rb
          git -C homebrew-tap commit -m "m2h ${{ needs.prepare.outputs.version }}"
          echo "changed=true" >> "${GITHUB_OUTPUT}"

      - name: Test Formula
        if: steps.release.outputs.publish == 'true' && steps.formula.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          brew tap lz-wang/tap "file://${GITHUB_WORKSPACE}/homebrew-tap"
          brew audit --strict --formula lz-wang/tap/m2h
          brew install --formula lz-wang/tap/m2h
          brew test lz-wang/tap/m2h

      - name: Publish Formula
        if: steps.release.outputs.publish == 'true' && steps.formula.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git -C homebrew-tap push origin HEAD:main

  notify:
    name: Pushover notification
    needs: [prepare, test, build, smoke, publish, homebrew]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify via Pushover
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag || github.ref_name }}
        shell: bash
        run: |
          if [[ -z "${PUSHOVER_TOKEN}" || -z "${PUSHOVER_USER}" ]]; then
            echo "Pushover secrets are not configured; skipping notification."
            exit 0
          fi

          TEST_RESULT="${{ needs.test.result }}"
          BUILD_RESULT="${{ needs.build.result }}"
          SMOKE_RESULT="${{ needs.smoke.result }}"
          PUBLISH_RESULT="${{ needs.publish.result }}"
          HOMEBREW_RESULT="${{ needs.homebrew.result }}"
          if [[ "${TEST_RESULT}" == "success" && "${BUILD_RESULT}" == "success" && "${SMOKE_RESULT}" == "success" && "${PUBLISH_RESULT}" == "success" && "${HOMEBREW_RESULT}" == "success" ]]; then
            PRIORITY="0"
            TITLE="m2h 发布成功"
          else
            PRIORITY="1"
            TITLE="m2h 发布失败"
          fi

          MESSAGE=$(cat <<EOF
          <b>m2h 发布通知</b>
          <u>测试结果</u>: ${TEST_RESULT}
          <u>构建结果</u>: ${BUILD_RESULT}
          <u>三平台 Smoke</u>: ${SMOKE_RESULT}
          <u>发布结果</u>: ${PUBLISH_RESULT}
          <u>Homebrew</u>: ${HOMEBREW_RESULT}
          <u>版本</u>: <font color="#0000ff">${RELEASE_TAG}</font>
          <u>触发人</u>: <i>${{ github.actor }}</i>
          <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">查看运行详情</a>
          <a href="${{ github.server_url }}/${{ github.repository }}/releases/tag/${RELEASE_TAG}">查看 GitHub Release</a>
          EOF
          )

          curl -fsS https://api.pushover.net/1/messages.json \
            --data-urlencode "token=${PUSHOVER_TOKEN}" \
            --data-urlencode "user=${PUSHOVER_USER}" \
            --data-urlencode "title=${TITLE}" \
            --data-urlencode "priority=${PRIORITY}" \
            --data-urlencode "html=1" \
            --data-urlencode "message=${MESSAGE}"
